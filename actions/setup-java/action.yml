name: "Setup Java and Gradle"
description: "Sets up Java JDK and Gradle with dependency caching"

branding:
  icon: "coffee"
  color: "orange"

inputs:
  java-version:
    description: "Java version to use"
    required: false
    default: "24"
  distribution:
    description: "Java distribution to use (temurin, corretto, zulu, etc.)"
    required: false
    default: "temurin"
  cache:
    description: "Build tool cache to use (gradle, maven, sbt). Set to empty string to disable."
    required: false
    default: "gradle"

runs:
  using: "composite"
  steps:
    - name: Set up JDK ${{ inputs.java-version }} (${{ inputs.distribution }})
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}
        cache: ${{ inputs.cache }}

    - name: Verify installation
      shell: bash
      run: |
        echo "java: $(java -version 2>&1 | head -1)"
        echo "javac: $(javac -version 2>&1)"
