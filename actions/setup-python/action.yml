name: "Setup Python"
description: "Sets up Python with pip/uv caching and optional dependency installation"

branding:
  icon: "package"
  color: "blue"

inputs:
  python-version:
    description: "Python version to install (e.g. 3.12, 3.13)"
    required: false
    default: "3.12"
  cache:
    description: "Cache manager to use: 'pip', 'uv', or empty string to disable"
    required: false
    default: "pip"
  cache-dependency-path:
    description: "Lockfile paths for cache key (newline-separated). Defaults to requirements.txt, pyproject.toml, uv.lock in working directory"
    required: false
    default: ""
  install-deps:
    description: "Whether to install dependencies after setup"
    required: false
    default: "true"
  working-directory:
    description: "Working directory for dependency installation"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Setup uv
      if: inputs.cache == 'uv'
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          requirements*.txt
          pyproject.toml
          uv.lock

    - name: Setup Python
      if: inputs.cache != 'uv'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Install dependencies (uv)
      if: inputs.cache == 'uv' && inputs.install-deps == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync --frozen

    - name: Install dependencies (pip)
      if: inputs.cache != 'uv' && inputs.install-deps == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -f "requirements.txt" ]; then
          pip install -r requirements.txt
        elif [ -f "pyproject.toml" ]; then
          pip install -e .
        else
          echo "⚠️ No requirements.txt or pyproject.toml found — skipping dependency install"
        fi

    - name: Verify installation
      shell: bash
      run: |
        echo "python: $(python --version)"
        echo "pip: $(pip --version)"
        if command -v uv >/dev/null 2>&1; then
          echo "uv: $(uv --version)"
        fi