name: "Setup Rust toolchain"
description: "Sets up Rust toolchain with components, targets, and build caching"

branding:
  icon: "box"
  color: "orange"

inputs:
  rust-version:
    description: "Rust toolchain version (stable, nightly, beta, or semver like 1.85.0)"
    required: false
    default: "stable"
  components:
    description: "Comma-separated list of components to install (e.g. clippy,rustfmt,rust-analyzer)"
    required: false
    default: "clippy,rustfmt"
  targets:
    description: "Comma-separated list of additional targets to install (e.g. wasm32-unknown-unknown)"
    required: false
    default: ""
  cache:
    description: "Enable Swatinem/rust-cache for ~/.cargo and target/ directories"
    required: false
    default: "true"
  cache-workspaces:
    description: "Additional paths to include in the cache key (newline-separated)"
    required: false
    default: ""
  sccache:
    description: "Install and configure sccache as RUSTC_WRAPPER for distributed compilation"
    required: false
    default: "false"
  working-directory:
    description: "Working directory for the cache key (defaults to repo root)"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
      with:
        toolchain: ${{ inputs.rust-version }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Cache cargo registry, git checkouts, and build artifacts
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: ${{ inputs.cache-workspaces != '' && format('{0}{1}{2}', inputs.working-directory, fromJSON('"\n"'), inputs.cache-workspaces) || inputs.working-directory }}
        cache-on-failure: true

    - name: Install sccache
      if: inputs.sccache == 'true'
      shell: bash
      run: |
        echo "📦 Installing sccache..."
        cargo install sccache --locked 2>/dev/null || {
          echo "⚠️ sccache install failed — falling back to cargo install sccache --git"
          cargo install sccache --git https://github.com/mozilla/sccache --locked --force
        }
        echo "RUSTC_WRAPPER=$(which sccache)" >> "$GITHUB_ENV"
        sccache --version

    - name: Verify installation
      shell: bash
      run: |
        echo "rustc: $(rustc --version)"
        echo "cargo: $(cargo --version)"
        echo "clippy: $(cargo clippy --version 2>/dev/null || echo 'not installed')"
        echo "rustfmt: $(rustfmt --version 2>/dev/null || echo 'not installed')"