name: "Setup Docker Buildx"
description: "Sets up QEMU and Docker Buildx for multi-platform container builds"

branding:
  icon: "layers"
  color: "blue"

inputs:
  buildx-version:
    description: "Docker Buildx version (leave empty for latest)"
    required: false
    default: ""
  buildkit-image:
    description: "Custom BuildKit image (e.g., moby/buildkit:v0.12.5)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        version: ${{ inputs.buildx-version != '' && inputs.buildx-version || '' }}
        driver-opts: ${{ inputs.buildkit-image != '' && format('image={0}', inputs.buildkit-image) || '' }}
