name: "Setup Docker Buildx"
description: "Sets up QEMU and Docker Buildx for multi-platform container builds"

branding:
  icon: "layers"
  color: "blue"

inputs:
  buildx-version:
    description: "Docker Buildx version (leave empty for latest)"
    required: false
    default: ""
  buildkit-image:
    description: "Custom BuildKit image (e.g., moby/buildkit:v0.12.5)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      with:
        version: ${{ inputs.buildx-version != '' && inputs.buildx-version || '' }}
        driver-opts: ${{ inputs.buildkit-image != '' && format('image={0}', inputs.buildkit-image) || '' }}
