# Reusable workflow: Close stale issues and PRs
# Usage:
#   jobs:
#     stale:
#       uses: dallay/common-actions/.github/workflows/stale.yml@v1
#       secrets: inherit
name: Close stale issues/PRs

on:
  workflow_call:
    inputs:
      days-before-stale:
        description: "Days before marking as stale"
        type: number
        required: false
        default: 120
      days-before-close:
        description: "Days after stale before closing"
        type: number
        required: false
        default: 60
      stale-issue-message:
        description: "Message posted when marking an issue as stale"
        type: string
        required: false
        default: "This issue was marked as stale due to inactivity. It will be closed automatically if there are no updates."
      stale-pr-message:
        description: "Message posted when marking a PR as stale"
        type: string
        required: false
        default: "This PR was marked as stale due to inactivity. It will be closed automatically if there are no updates."
      close-issue-message:
        description: "Message posted when closing an issue"
        type: string
        required: false
        default: "This issue has been automatically closed due to inactivity."
      close-pr-message:
        description: "Message posted when closing a PR"
        type: string
        required: false
        default: "This pull request has been automatically closed due to inactivity."
      exempt-issue-labels:
        description: "Comma-separated labels to exempt from stale (issues)"
        type: string
        required: false
        default: "priority:high,security"
      exempt-pr-labels:
        description: "Comma-separated labels to exempt from stale (PRs)"
        type: string
        required: false
        default: "priority:high,security"
    secrets:
      github-token:
        description: "GitHub token for stale management (defaults to GITHUB_TOKEN)"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Close stale issues/PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          repo-token: ${{ secrets.github-token || github.token }}
          days-before-stale: ${{ inputs.days-before-stale }}
          days-before-close: ${{ inputs.days-before-close }}
          stale-issue-message: ${{ inputs.stale-issue-message }}
          stale-pr-message: ${{ inputs.stale-pr-message }}
          close-issue-message: ${{ inputs.close-issue-message }}
          close-pr-message: ${{ inputs.close-pr-message }}
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: ${{ inputs.exempt-issue-labels }}
          exempt-pr-labels: ${{ inputs.exempt-pr-labels }}
