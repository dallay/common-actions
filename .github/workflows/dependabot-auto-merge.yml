name: Dependabot Auto-Merge

on:
  workflow_call:
    inputs:
      target:
        description: 'Merge strategy: squash, merge, or rebase'
        required: false
        type: string
        default: 'squash'
      approve:
        description: 'Auto-approve the PR before merging'
        required: false
        type: boolean
        default: true
    secrets:
      APP_ID:
        description: 'GitHub App ID (optional if using secrets.token)'
        required: false
      APP_PRIVATE_KEY:
        description: 'GitHub App Private Key (optional if using secrets.token)'
        required: false
      token:
        description: 'Fallback GitHub token (personal or GITHUB_TOKEN)'
        required: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || github.actor == 'renovate[bot]' || github.actor == 'dependabot-preview[bot]'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate GitHub App Token
        id: app-token
        if: ${{ (secrets.APP_ID != '' || vars.APP_ID != '') && (secrets.APP_PRIVATE_KEY != '' || vars.APP_PRIVATE_KEY != '') }}
        uses: actions/create-github-app-token@f2acdbd3c0c11b281dd8d7cd543fe3d0e24b7bde
        with:
          app-id: ${{ secrets.APP_ID || vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY || vars.APP_PRIVATE_KEY }}

      - name: Set Token Environment
        id: set-token
        run: |
          if [ -n "${{ steps.app-token.outputs.token }}" ]; then
            echo "token=${{ steps.app-token.outputs.token }}" >> $GITHUB_OUTPUT
          else
            echo "token=${{ secrets.token || github.token }}" >> $GITHUB_OUTPUT
          fi

      - name: Get PR metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a
        with:
          github-token: ${{ steps.set-token.outputs.token }}

      - name: Validate merge target
        run: |
          if [[ "$MERGE_TARGET" != "squash" && "$MERGE_TARGET" != "merge" && "$MERGE_TARGET" != "rebase" ]]; then
            echo "Error: Invalid merge target '$MERGE_TARGET'. Must be one of: squash, merge, rebase"
            exit 1
          fi
        env:
          MERGE_TARGET: ${{ inputs.target }}

      - name: Auto-approve PR
        if: inputs.approve
        run: |
          gh pr review "$PR_NUMBER" --approve --body "✅ Auto-approved by workflow (GitHub App)"
        env:
          GH_TOKEN: ${{ steps.set-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Enable auto-merge
        run: |
          gh pr merge "$PR_NUMBER" --auto --"$MERGE_TARGET" --delete-branch
        env:
          GH_TOKEN: ${{ steps.set-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_TARGET: ${{ inputs.target }}

      - name: Add sticky comment
        if: success()
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405
        with:
          header: auto-merge-status
          message: |
            🤖 Auto-merge habilitado (GitHub App)

            Este PR será fusionado automáticamente cuando:
            - ✅ Todos los checks requeridos pasen
            - ✅ Las revisiones requeridas estén aprobadas
            - ✅ No haya conflictos de merge

            Estrategia: ${{ env.MERGE_TARGET }}
          GITHUB_TOKEN: ${{ steps.set-token.outputs.token }}
        env:
          MERGE_TARGET: ${{ inputs.target }}

      - name: Comment on failure
        if: failure()
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405
        with:
          header: auto-merge-status
          message: |
            ⚠️ Auto-merge falló

            Revisa los logs del workflow para más detalles.
            Puede que necesites resolver conflictos o aprobar manualmente.
          GITHUB_TOKEN: ${{ steps.set-token.outputs.token }}
