name: Dependabot Auto-Merge

on:
  workflow_call:
    inputs:
      target:
        description: 'Merge strategy: squash, merge, or rebase'
        required: false
        type: string
        default: 'squash'
      approve:
        description: 'Auto-approve the PR before merging'
        required: false
        type: boolean
        default: true
    secrets:
      APP_ID:
        description: 'GitHub App ID (optional if using secrets.token)'
        required: false
      APP_PRIVATE_KEY:
        description: 'GitHub App Private Key (optional if using secrets.token)'
        required: false
      token:
        description: 'Fallback GitHub token (personal or GITHUB_TOKEN)'
        required: false

jobs:
  # When this file lives in the source repo (.github/workflows/), GitHub
  # Actions creates an empty run on every push to the default branch because
  # `on: workflow_call` is the only trigger. The run completes with 0 jobs
  # and is marked as failure, polluting the Actions UI.
  #
  # This noop job makes those pushes succeed (1 job, success) while leaving
  # real callers via `workflow_call` completely unaffected — it runs first
  # and exits immediately.
  noop:
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Reusable workflow — no work to do for ${{ github.event_name }} events."

  auto-merge:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_call' && (github.actor == 'dependabot[bot]' || github.actor == 'renovate[bot]' || github.actor == 'dependabot-preview[bot]')
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate GitHub App Token
        id: app-token
        if: ${{ (secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '') || (vars.APP_ID != '' && vars.APP_PRIVATE_KEY != '') }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.APP_ID || vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY || vars.APP_PRIVATE_KEY }}

      - name: Determine token source
        id: token-source
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
            echo "source=app" >> "$GITHUB_OUTPUT"
          else
            echo "token=$FALLBACK_TOKEN" >> "$GITHUB_OUTPUT"
            echo "source=fallback" >> "$GITHUB_OUTPUT"
          fi
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.token || github.token }}

      - name: Get PR metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a
        with:
          github-token: ${{ steps.token-source.outputs.token }}

      - name: Validate merge target
        run: |
          if [[ "$MERGE_TARGET" != "squash" && "$MERGE_TARGET" != "merge" && "$MERGE_TARGET" != "rebase" ]]; then
            echo "Error: Invalid merge target '$MERGE_TARGET'. Must be one of: squash, merge, rebase"
            exit 1
          fi
        env:
          MERGE_TARGET: ${{ inputs.target }}

      - name: Auto-approve PR
        if: inputs.approve
        run: |
          if [ "$TOKEN_SOURCE" = "app" ]; then
            SOURCE_TEXT="GitHub App"
          else
            SOURCE_TEXT="fallback token"
          fi
          gh pr review "$PR_NUMBER" --approve --body "✅ Auto-approved by workflow ($SOURCE_TEXT)"
        env:
          GH_TOKEN: ${{ steps.token-source.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TOKEN_SOURCE: ${{ steps.token-source.outputs.source }}

      - name: Enable auto-merge
        run: |
          gh pr merge "$PR_NUMBER" --auto --"$MERGE_TARGET" --delete-branch
        env:
          GH_TOKEN: ${{ steps.token-source.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_TARGET: ${{ inputs.target }}

      - name: Add sticky comment
        if: success()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3
        with:
          header: auto-merge-status
          message: |
            🤖 Auto-merge habilitado (${{ steps.token-source.outputs.source == 'app' && 'GitHub App' || 'fallback token' }})

            Este PR será fusionado automáticamente cuando:
            - ✅ Todos los checks requeridos pasen
            - ✅ Las revisiones requeridas estén aprobadas
            - ✅ No haya conflictos de merge

            Estrategia: ${{ env.MERGE_TARGET }}
          GITHUB_TOKEN: ${{ steps.token-source.outputs.token }}
        env:
          MERGE_TARGET: ${{ inputs.target }}

      - name: Comment on failure
        if: failure()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3
        with:
          header: auto-merge-status
          message: |
            ⚠️ Auto-merge falló

            Revisa los logs del workflow para más detalles.
            Puede que necesites resolver conflictos o aprobar manualmente.
          GITHUB_TOKEN: ${{ steps.token-source.outputs.token }}
