name: Dependabot Auto-Merge

on:
  workflow_call:
    inputs:
      target:
        description: 'Merge strategy: squash, merge, or rebase'
        required: false
        type: string
        default: 'squash'
      approve:
        description: 'Auto-approve the PR before merging'
        required: false
        type: boolean
        default: true
    secrets:
      token:
        description: 'GitHub token with repo and workflow permissions'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || github.actor == 'renovate[bot]' || github.actor == 'dependabot-preview[bot]'
    
    steps:
      - name: Get PR metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.token }}

      - name: Auto-approve PR
        if: inputs.approve
        run: |
          gh pr review "${{ github.event.pull_request.number }}" --approve --body "✅ Auto-approved by workflow"
        env:
          GH_TOKEN: ${{ secrets.token }}
          GH_REPO: ${{ github.repository }}

      - name: Enable auto-merge
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" --auto --${{ inputs.target }} --delete-branch
        env:
          GH_TOKEN: ${{ secrets.token }}
          GH_REPO: ${{ github.repository }}

      - name: Add sticky comment
        if: success()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: auto-merge-status
          message: |
            🤖 **Auto-merge habilitado**
            
            Este PR será fusionado automáticamente cuando:
            - ✅ Todos los checks requeridos pasen
            - ✅ Las revisiones requeridas estén aprobadas
            - ✅ No haya conflictos de merge
            
            Estrategia: `${{ inputs.target }}`
          GITHUB_TOKEN: ${{ secrets.token }}

      - name: Comment on failure
        if: failure()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: auto-merge-status
          message: |
            ⚠️ **Auto-merge falló**
            
            Revisa los logs del workflow para más detalles.
            Puede que necesites resolver conflictos o aprobar manualmente.
          GITHUB_TOKEN: ${{ secrets.token }}
