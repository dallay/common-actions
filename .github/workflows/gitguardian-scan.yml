# Reusable workflow: Scan repository history for exposed secrets with GitGuardian
# Usage:
#   jobs:
#     gitguardian-scan:
#       uses: dallay/common-actions/.github/workflows/gitguardian-scan.yml@v1
#       secrets:
#         gitguardian-api-key: ${{ secrets.GITGUARDIAN_API_KEY }}
name: GitGuardian scan

on:
  workflow_call:
    secrets:
      gitguardian-api-key:
        description: "GitGuardian API key used by ggshield"
        required: true

permissions:
  contents: read

jobs:
  scanning:
    name: GitGuardian scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: GitGuardian scan
        uses: GitGuardian/ggshield/actions/secret@4cccd600fd3890a7aba07fd0a45e483f3099fe70 # v1.56.1
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.gitguardian-api-key }}
