name: Private Deploy

on:
  workflow_call:
    inputs:
      deployment-url:
        description: Non-secret full URL of the private endpoint (HTTP or HTTPS)
        required: false
        default: ''
        type: string
      deployment-payload:
        description: JSON body for the POST request
        required: true
        type: string
      api-key-header:
        description: Name of the header that receives the API key
        required: false
        default: x-api-key
        type: string
      tailscale-auth-mode:
        description: Tailscale authentication mode
        required: false
        default: oidc
        type: string
      tailscale-client-id:
        description: OAuth client ID for Tailscale authentication
        required: true
        type: string
      tailscale-audience:
        description: Configured OIDC audience; required in oidc mode
        required: false
        default: ''
        type: string
      tailscale-tags:
        description: Authorized tags for the ephemeral node
        required: true
        type: string
    secrets:
      api-key:
        description: Full value of the authentication header when required by the endpoint
        required: false
      deployment-url:
        description: Full private endpoint URL; store credential-bearing URLs as a secret
        required: false
      tailscale-oauth-secret:
        description: OAuth client secret; required in oauth mode
        required: false

permissions: {}

concurrency:
  group: private-deploy-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-auth-mode:
    name: Validate Tailscale authentication mode
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Validate authentication mode
        env:
          TAILSCALE_AUTH_MODE: ${{ inputs.tailscale-auth-mode }}
        shell: bash
        run: |
          case "$TAILSCALE_AUTH_MODE" in
            oidc|oauth) ;;
            *) echo "::error::Tailscale authentication mode must be oidc or oauth." >&2; exit 1 ;;
          esac

  deploy-oidc:
    needs: validate-auth-mode
    if: ${{ inputs.tailscale-auth-mode == 'oidc' }}
    name: Send private request using OIDC
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Validate OIDC parameters
        env:
          TAILSCALE_CLIENT_ID: ${{ inputs.tailscale-client-id }}
          TAILSCALE_AUDIENCE: ${{ inputs.tailscale-audience }}
          TAILSCALE_TAGS: ${{ inputs.tailscale-tags }}
        shell: bash
        run: |
          if [[ -z "${TAILSCALE_CLIENT_ID//[[:space:]]/}" || -z "${TAILSCALE_AUDIENCE//[[:space:]]/}" || -z "${TAILSCALE_TAGS//[[:space:]]/}" ]]; then
            echo "::error::Tailscale client ID, audience, and tags are required in oidc mode." >&2
            exit 1
          fi

      - &validate-deployment
        name: Validate deployment parameters before connecting
        env:
          DEPLOYMENT_URL: ${{ secrets.deployment-url || inputs.deployment-url }}
          DEPLOYMENT_PAYLOAD: ${{ inputs.deployment-payload }}
          API_KEY_HEADER: ${{ inputs.api-key-header }}
          API_KEY: ${{ secrets.api-key || '' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from urllib.parse import urlsplit

          def fail(message):
              print(f"::error::{message}", file=sys.stderr)
              sys.exit(1)

          url = os.environ["DEPLOYMENT_URL"]
          try:
              if any(c.isspace() or ord(c) < 32 or ord(c) == 127 for c in url) or "\\" in url or "#" in url:
                  raise ValueError()
              parsed = urlsplit(url)
              if parsed.scheme not in ("http", "https") or not parsed.hostname or parsed.username is not None or parsed.password is not None:
                  raise ValueError()
              _ = parsed.port
          except ValueError:
              fail("The URL must be HTTP/HTTPS, with no credentials, fragment, or spaces.")

          def reject_constant(_):
              raise ValueError()

          try:
              json.loads(os.environ["DEPLOYMENT_PAYLOAD"], parse_constant=reject_constant)
          except (ValueError, RecursionError):
              fail("The payload must be valid JSON.")
          if not re.fullmatch(r"[!#$%&'*+.^_`|~0-9A-Za-z-]+", os.environ["API_KEY_HEADER"]):
              fail("The header name must be an HTTP token.")
          key = os.environ["API_KEY"]
          if any(ord(c) < 32 or ord(c) == 127 for c in key):
              fail("The API key cannot contain control characters.")
          PY

      - name: Connect to private network via OIDC
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ inputs.tailscale-client-id }}
          audience: ${{ inputs.tailscale-audience }}
          tags: ${{ inputs.tailscale-tags }}

      - &send-deployment
        name: Send POST without exposing values
        env:
          DEPLOYMENT_URL: ${{ secrets.deployment-url || inputs.deployment-url }}
          DEPLOYMENT_PAYLOAD: ${{ inputs.deployment-payload }}
          API_KEY_HEADER: ${{ inputs.api-key-header }}
          API_KEY: ${{ secrets.api-key || '' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          try:
              command = [
                  "curl", "--disable", "--silent", "--globoff",
                  "--noproxy", "*", "--proto", "=http,https",
                  "--request", "POST", "--url", os.environ["DEPLOYMENT_URL"],
                  "--header", "Content-Type: application/json",
              ]
              if os.environ["API_KEY"]:
                  command.extend(["--header", os.environ["API_KEY_HEADER"] + ": " + os.environ["API_KEY"]])
              command.extend([
                  "--data-binary", "@-", "--output", "/dev/null",
                  "--write-out", "%{http_code}", "--connect-timeout", "10",
                  "--max-time", "60", "--retry", "0", "--max-redirs", "0",
              ])
              result = subprocess.run(command, input=os.environ["DEPLOYMENT_PAYLOAD"].encode("utf-8"),
                  stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=65)
              accepted = result.returncode == 0 and re.fullmatch(rb"2[0-9]{2}", result.stdout)
          except (OSError, subprocess.TimeoutExpired, UnicodeError):
              accepted = False
          if not accepted:
              print("::error::Request failed or did not receive an HTTP 2xx response. It was not retried.", file=sys.stderr)
              sys.exit(1)
          print("Request accepted (HTTP 2xx); deployment completion was not verified.")
          PY

  deploy-oauth:
    needs: validate-auth-mode
    if: ${{ inputs.tailscale-auth-mode == 'oauth' }}
    name: Send private request using OAuth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate OAuth parameters
        env:
          TAILSCALE_CLIENT_ID: ${{ inputs.tailscale-client-id }}
          TAILSCALE_OAUTH_SECRET: ${{ secrets.tailscale-oauth-secret || '' }}
          TAILSCALE_TAGS: ${{ inputs.tailscale-tags }}
        shell: bash
        run: |
          if [[ -z "${TAILSCALE_CLIENT_ID//[[:space:]]/}" || -z "${TAILSCALE_OAUTH_SECRET//[[:space:]]/}" || -z "${TAILSCALE_TAGS//[[:space:]]/}" ]]; then
            echo "::error::Tailscale client ID, OAuth secret, and tags are required in oauth mode." >&2
            exit 1
          fi

      - *validate-deployment

      - name: Connect to private network via OAuth
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ inputs.tailscale-client-id }}
          oauth-secret: ${{ secrets.tailscale-oauth-secret }}
          tags: ${{ inputs.tailscale-tags }}

      - *send-deployment
