name: Private Deploy

on:
  workflow_call:
    inputs:
      deployment-url:
        description: Full URL of the private endpoint (HTTP or HTTPS)
        required: true
        type: string
      deployment-payload:
        description: JSON body for the POST request
        required: true
        type: string
      api-key-header:
        description: Name of the header that receives the API key
        required: false
        default: x-api-key
        type: string
      tailscale-client-id:
        description: Client ID for the Tailscale federated identity
        required: true
        type: string
      tailscale-audience:
        description: Configured OIDC audience in Tailscale
        required: true
        type: string
      tailscale-tags:
        description: Authorized tags for the ephemeral node
        required: true
        type: string
    secrets:
      api-key:
        description: Full value of the authentication header
        required: true

permissions:
  id-token: write

concurrency:
  group: private-deploy-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}-${{ inputs.deployment-url }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Send private request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate parameters before connecting
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment-url }}
          DEPLOYMENT_PAYLOAD: ${{ inputs.deployment-payload }}
          API_KEY_HEADER: ${{ inputs.api-key-header }}
          API_KEY: ${{ secrets.api-key }}
          TAILSCALE_CLIENT_ID: ${{ inputs.tailscale-client-id }}
          TAILSCALE_AUDIENCE: ${{ inputs.tailscale-audience }}
          TAILSCALE_TAGS: ${{ inputs.tailscale-tags }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from urllib.parse import urlsplit

          def fail(message):
              print(f"::error::{message}", file=sys.stderr)
              sys.exit(1)

          url = os.environ["DEPLOYMENT_URL"]
          try:
              if any(c.isspace() or ord(c) < 32 or ord(c) == 127 for c in url) or "\\" in url or "#" in url:
                  raise ValueError()
              parsed = urlsplit(url)
              if parsed.scheme not in ("http", "https") or not parsed.hostname or parsed.username is not None or parsed.password is not None:
                  raise ValueError()
              # Accessing the port also validates its format and range.
              _ = parsed.port
          except ValueError:
              fail("The URL must be HTTP/HTTPS, with no credentials, fragment, or spaces.")

          def reject_constant(_):
              raise ValueError()

          try:
              json.loads(os.environ["DEPLOYMENT_PAYLOAD"], parse_constant=reject_constant)
          except (ValueError, RecursionError):
              fail("The payload must be valid JSON.")
          if not re.fullmatch(r"[!#$%&'*+.^_`|~0-9A-Za-z-]+", os.environ["API_KEY_HEADER"]):
              fail("The header name must be an HTTP token.")
          key = os.environ["API_KEY"]
          if not key.strip() or any(ord(c) < 32 or ord(c) == 127 for c in key):
              fail("The API key cannot be empty or contain control characters.")
          for name in ("TAILSCALE_CLIENT_ID", "TAILSCALE_AUDIENCE", "TAILSCALE_TAGS"):
              if not os.environ[name].strip():
                  fail("Tailscale OIDC parameters cannot be empty.")
          PY

      - name: Connect to private network via OIDC
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ inputs.tailscale-client-id }}
          audience: ${{ inputs.tailscale-audience }}
          tags: ${{ inputs.tailscale-tags }}

      - name: Send POST without exposing values
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment-url }}
          DEPLOYMENT_PAYLOAD: ${{ inputs.deployment-payload }}
          API_KEY_HEADER: ${{ inputs.api-key-header }}
          API_KEY: ${{ secrets.api-key }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          try:
              result = subprocess.run([
                  "curl", "--disable", "--silent", "--globoff",
                  "--noproxy", "*", "--proto", "=http,https",
                  "--request", "POST", "--url", os.environ["DEPLOYMENT_URL"],
                  "--header", "Content-Type: application/json",
                  "--header", os.environ["API_KEY_HEADER"] + ": " + os.environ["API_KEY"],
                  "--data-binary", "@-", "--output", "/dev/null",
                  "--write-out", "%{http_code}", "--connect-timeout", "10",
                  "--max-time", "60", "--retry", "0", "--max-redirs", "0",
              ], input=os.environ["DEPLOYMENT_PAYLOAD"].encode("utf-8"),
                  stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=65)
              accepted = result.returncode == 0 and re.fullmatch(rb"2[0-9]{2}", result.stdout)
          except (OSError, subprocess.TimeoutExpired, UnicodeError):
              accepted = False
          if not accepted:
              print("::error::Request failed or did not receive an HTTP 2xx response. It was not retried.", file=sys.stderr)
              sys.exit(1)
          print("Request accepted (HTTP 2xx); deployment completion was not verified.")
          PY
