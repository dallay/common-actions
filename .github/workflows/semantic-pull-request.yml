# Reusable workflow alias: Lint PR titles against Conventional Commits spec
# Alias for semantic-pr.yml to support consumers invoking semantic-pull-request.yml
# Usage:
#   permissions:
#     contents: read
#     pull-requests: write # Required for sticky PR status comments
#   jobs:
#     lint-pr:
#       uses: dallay/common-actions/.github/workflows/semantic-pull-request.yml@v2
#       secrets: inherit
name: Lint PR title

on:
  workflow_call:
    inputs:
      skip-bots:
        description: "JSON array of bot usernames to skip validation for (e.g. '[\"dependabot[bot]\",\"renovate[bot]\"]')"
        type: string
        required: false
        default: '["dependabot[bot]","renovate[bot]"]'
    secrets:
      github-token:
        description: "GitHub token for PR title validation and comments (defaults to GITHUB_TOKEN)"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  pull-requests: write

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    if: ${{ !contains(fromJson(inputs.skip-bots), github.actor) }}
    env:
      GITHUB_TOKEN: ${{ secrets.github-token || github.token }}
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6
        id: lint_pr_title

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3
        if: always() && (steps.lint_pr_title.outputs.error_message != null)
        continue-on-error: true
        with:
          header: pr-title-lint-error
          message: |
            Hey there and thank you for opening this pull request!

            We require pull request titles to follow the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/) and it looks like your proposed title needs to be adjusted.

            Details:

            ```
            ${{ steps.lint_pr_title.outputs.error_message }}
            ```

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3
        if: ${{ steps.lint_pr_title.outputs.error_message == null }}
        continue-on-error: true
        with:
          header: pr-title-lint-error
          delete: true
